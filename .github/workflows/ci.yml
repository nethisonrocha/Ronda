name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nucleo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Testes
        run: uv run pytest
      - name: Build
        run: uv build
