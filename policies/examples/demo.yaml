# Política do tenant de demonstração. É a política da especificação, completada
# com as categorias que lá ficaram de fora (ataque_web, reconhecimento, exfiltracao, benigno).
# `desconhecido` fica sem regra de propósito: vale a prioridade base da taxonomia (P3).
tenant: demo
versao: 4

# Criticidade de um ativo que não está no inventário.
criticidade_padrao: media

ativos:
  - nome: servidor-pagamentos
    rede: 10.0.1.0/28
    criticidade: alta
  - nome: servidor-web
    rede: 10.0.0.0/24
    criticidade: media
  - nome: ambiente-testes
    rede: 10.0.9.0/24
    criticidade: baixa

impacto:          # categoria x criticidade do ativo
  comprometimento: {alta: alto,  media: alto,  baixa: medio}
  ataque_web:      {alta: alto,  media: medio, baixa: baixo}
  negacao_servico: {alta: alto,  media: medio, baixa: baixo}
  forca_bruta:     {alta: medio, media: baixo, baixa: baixo}
  reconhecimento:  {alta: baixo, media: baixo, baixa: baixo}
  exfiltracao:     {alta: alto,  media: alto,  baixa: medio}
  benigno:         {alta: baixo, media: baixo, baixa: baixo}

urgencia:
  base:
    # Comprometimento parte de média: o sudo de rotina e o da escalada são o mesmo alerta, e
    # só o contexto separa os dois (decisão A5 de 06/10/2026). Sobe para alta fora do
    # expediente ou depois de outro incidente grave no mesmo ativo.
    comprometimento: media
    ataque_web: alta
    negacao_servico: alta
    forca_bruta: media
    reconhecimento: baixa
    exfiltracao: alta
    benigno: baixa
  modificadores:
    - se: recorrencia_24h >= 5
      subir: 1
      exceto: [forca_bruta, comprometimento]
    # Usuário errando a senha passa de 5 falhas em 24 h todo dia; na avaliação, nenhum limiar
    # separou o erro comum do ataque, e 50 deixou 19 incidentes de ruído (A1).
    - se: recorrencia_24h >= 50
      subir: 1
      categorias: [forca_bruta]
    - se: fora_do_horario
      subir: 1
      categorias: [comprometimento]
    - se: ataque_previo_no_ativo
      subir: 1
      categorias: [comprometimento]
    - se: confirmado
      subir: 1

matriz:           # impacto -> urgencia -> prioridade
  alto:  {alta: P1, media: P2, baixa: P3}
  medio: {alta: P2, media: P3, baixa: P4}
  baixo: {alta: P3, media: P4, baixa: P4}

expediente:       # fora dele, o contexto marca fora_do_horario
  fuso: America/Fortaleza
  dias: [seg, ter, qua, qui, sex]
  inicio: "08:00"
  fim: "18:00"

correlacao:
  # Eventos com a mesma origem, categoria e ativo, com até 30 min entre um e outro, viram um
  # incidente só. Passada a janela sem evento novo, o incidente se encerra por inatividade.
  janela: 30min

notificacao:
  canal: telegram
  # Nome da variável de ambiente com o chat id do Telegram; o valor fica no .env, nunca aqui.
  destino_env: RONDA_TELEGRAM_CHAT_DEMO
  fuso: America/Fortaleza
  modos:            # P1 fura o horário de silêncio; P4 fica só no dashboard
    P1: imediata
    P2: agrupada
    P3: resumo_diario
    P4: nunca
  agrupamento: 10min          # P2 da mesma origem numa janela vira uma mensagem só
  # Mesma origem, categoria e ativo: não repete no mesmo nível. Precisa ser maior que a janela
  # da correlação; igual a ela, nunca suprimia nada (A3).
  silencio_por_origem: 2h
  horario_silencio: {inicio: "22:00", fim: "07:00"}
  resumo_diario: "08:00"

resposta:         # P4 sem prazo: fica só no dashboard
  P1: 15min
  P2: 1h
  P3: 24h
