# Política da avaliação da fase 2 sobre os 8 cenários do AIT-ADS.
#
# A matriz, o impacto, a urgência e a correlação são os da política de demonstração, sem nenhum
# ajuste: a avaliação mede a política como ela está, não uma versão afinada para o dataset.
# O que muda é o que só existe por cenário:
#
# - `ativos` fica vazio aqui e é preenchido pelo notebook a partir do CSV de cada cenário
#   (host → IP), com a criticidade por papel de `ronda.avaliacao.ait_ads.CRITICIDADE_POR_PAPEL`;
# - o fuso é o do laboratório do AIT (Viena), para o horário de silêncio e o resumo diário.
tenant: ait-ads
versao: 2

criticidade_padrao: media
ativos: []

impacto:
  comprometimento: {alta: alto,  media: alto,  baixa: medio}
  ataque_web:      {alta: alto,  media: medio, baixa: baixo}
  negacao_servico: {alta: alto,  media: medio, baixa: baixo}
  forca_bruta:     {alta: medio, media: baixo, baixa: baixo}
  reconhecimento:  {alta: baixo, media: baixo, baixa: baixo}
  exfiltracao:     {alta: alto,  media: alto,  baixa: medio}
  benigno:         {alta: baixo, media: baixo, baixa: baixo}

urgencia:
  base:
    # Comprometimento parte de média: o sudo de rotina e o da escalada são o mesmo alerta, e
    # só o contexto separa os dois (decisão A5 de 06/10/2026). Sobe para alta fora do
    # expediente ou depois de outro incidente grave no mesmo ativo.
    comprometimento: media
    ataque_web: alta
    negacao_servico: alta
    forca_bruta: media
    reconhecimento: baixa
    exfiltracao: alta
    benigno: baixa
  modificadores:
    - se: recorrencia_24h >= 5
      subir: 1
      exceto: [forca_bruta, comprometimento]
    # Usuário errando a senha passa de 5 falhas em 24 h todo dia; na avaliação, nenhum limiar
    # separou o erro comum do ataque, e 50 deixou 19 incidentes de ruído (A1).
    - se: recorrencia_24h >= 50
      subir: 1
      categorias: [forca_bruta]
    - se: fora_do_horario
      subir: 1
      categorias: [comprometimento]
    - se: ataque_previo_no_ativo
      subir: 1
      categorias: [comprometimento]
    - se: confirmado
      subir: 1

matriz:
  alto:  {alta: P1, media: P2, baixa: P3}
  medio: {alta: P2, media: P3, baixa: P4}
  baixo: {alta: P3, media: P4, baixa: P4}

expediente:       # fora dele, o contexto marca fora_do_horario
  fuso: Europe/Vienna
  dias: [seg, ter, qua, qui, sex]
  inicio: "08:00"
  fim: "18:00"

correlacao:
  janela: 30min

notificacao:
  canal: telegram
  # Nunca lida: a avaliação envia para o canal falso.
  destino_env: RONDA_TELEGRAM_CHAT_AVALIACAO
  fuso: Europe/Vienna
  modos:
    P1: imediata
    P2: agrupada
    P3: resumo_diario
    P4: nunca
  agrupamento: 10min
  silencio_por_origem: 2h
  horario_silencio: {inicio: "22:00", fim: "07:00"}
  resumo_diario: "08:00"

resposta:
  P1: 15min
  P2: 1h
  P3: 24h
