[project]
name = "ronda"
version = "0.1.0"
description = "Governança ITIL para alertas de segurança: prioridade P1–P4 configurável, rastro de decisão e alertas em português."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "redis>=5.2",
    "sqlalchemy>=2.0.36",
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
ronda = "ronda.cli:main"

[project.optional-dependencies]
notebooks = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.120",
    "pytest>=8.3",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ronda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integracao: usa serviços reais (PostgreSQL via testcontainers); exige Docker",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["detector", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Textos em português usam "–", "×" e aspas tipográficas de propósito.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.uv]
link-mode = "copy"
