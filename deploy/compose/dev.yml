# Ambiente local de desenvolvimento: PostgreSQL e Redis, sem a aplicação.
#
#   docker compose -f deploy/compose/dev.yml --env-file .env up -d
#   docker compose -f deploy/compose/dev.yml --env-file .env down
#
# A aplicação roda no host com `uv run`. As portas ficam presas em 127.0.0.1 e, por padrão,
# fogem das que outros projetos desta máquina usam (5432-5434 e 6379-6381). Os dados ficam em
# volumes nomeados; `down -v` apaga tudo.

name: ronda-dev

services:
  postgres:
    # Mesma versão maior da VPS (16).
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${RONDA_PG_DB:-ronda}
      POSTGRES_USER: ${RONDA_PG_USER:-ronda}
      POSTGRES_PASSWORD: ${RONDA_PG_PASSWORD:?defina RONDA_PG_PASSWORD no .env}
      # Papel sem privilégios da aplicação, criado pelo script em initdb/ (sujeito à RLS).
      RONDA_APP_PASSWORD: ${RONDA_APP_PASSWORD:?defina RONDA_APP_PASSWORD no .env}
    ports:
      - "127.0.0.1:${RONDA_PG_PORT:-5435}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    restart: "no"

  redis:
    # Mesma versão maior da VPS (7). Com noeviction, uma stream nunca é descartada em
    # silêncio: se a memória acabar, a escrita falha e o erro aparece.
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${RONDA_REDIS_PASSWORD:?defina RONDA_REDIS_PASSWORD no .env}
      - --appendonly
      - "yes"
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${RONDA_REDIS_PORT:-6382}:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${RONDA_REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      RONDA_REDIS_PASSWORD: ${RONDA_REDIS_PASSWORD}
    mem_limit: 128m
    restart: "no"

volumes:
  postgres:
  redis:
