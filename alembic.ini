# Alembic do Ronda. Uso: uv run alembic upgrade head
#
# A URL vem de RONDA_DATABASE_MIGRATION_URL (config.py / .env), com o papel dono das tabelas.
# Para apontar para outro banco numa chamada: uv run alembic -x url=postgresql+psycopg://... upgrade head

[alembic]
script_location = %(here)s/src/ronda/storage/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
# O nome da revisão é o número sequencial (0001, 0002...), passado com --rev-id.
truncate_slug_length = 60

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
