  cic-ids2017:
    nome: CIC-IDS2017
    uso: [detector]
    pagina: https://www.unb.ca/cic/datasets/ids-2017.html
    versao: "captura de 03/07 a 07/07/2017; CSV de 07/06/2018"
    # Sem licença nomeada: a UNB só diz "publicly available for researchers" e pede a
    # citação. Nada sobre redistribuição ou uso comercial: não redistribua trechos.
    licenca: sem licença publicada (uso em pesquisa, com citação)
    citacao: >-
      Sharafaldin, Lashkari e Ghorbani. Toward Generating a New Intrusion Detection
      Dataset and Intrusion Traffic Characterization. ICISSP 2018, pp. 108–116.
      DOI 10.5220/0006639801080116.
    download: manual      # a UNB pede formulário antes de liberar o download
    arquivos:
      # O conteúdo do zip fica atrás do formulário: o sha256 do zip e a pasta interna não
      # foram conferidos. Os CSV abaixo são os que estão na máquina.
