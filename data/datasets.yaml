          shaw_wazuh.json: 45e34b65ce08c6a49b0ba52a4f36dbe5829d26240a2acccf8b3842201b6afca8
          wardbeck_aminer.json: cc4f073ff9f7bea57b17aa263d58c7cc0b4a7a3b9499cdf3491cf1510d3a98bd
          wardbeck_wazuh.json: b4e483c67e4de2a20b1b559692981e912fb83f1d1831b6e1f7e5760b16fe7117
