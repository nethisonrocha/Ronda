# Manifesto dos datasets. É a fonte única do que `make data` baixa.
#
# Cada arquivo tem url, sha256 e se deve ser descompactado em data/raw/<dataset>/.
# Campos null ainda não foram conferidos: preencha a partir da página oficial antes de
# usar o dataset. Com sha256 null, o script baixa, mostra o checksum calculado e avisa;
# cole o valor aqui para travar a versão.
#
# Conferido em 06/10/2026 nas páginas oficiais (pendência D1). Os sha256 de `conteudo` são
# dos arquivos que já estavam na máquina; o script os aceita sem baixar o pacote de novo.
#
# download: automatico  → o script baixa pela url
# download: manual      → exige cadastro ou acordo; o script só diz onde colocar o arquivo

datasets:
  ait-ads:
    nome: AIT Alert Data Set (AIT-ADS)
    uso: [governance-eval, translator]
    pagina: https://zenodo.org/records/8263181   # DOI 10.5281/zenodo.8263181
    versao: "1 (Zenodo, 2023-08-18)"
    licenca: CC-BY-4.0    # trechos podem ser redistribuídos com atribuição (D4)
    citacao: >-
      Landauer, Skopik e Wurzenberger. Introducing a New Alert Data Set for Multi-Step
      Attack Analysis. CSET 2024, pp. 41–53. DOI 10.1145/3675741.3675748 (preprint:
      arXiv:2308.12627, 2023).
    download: automatico
    # O zip não tem pasta: os 16 JSON (aminer e wazuh) vão para raw/ait-ads/json. O
    # labels.csv (início e fim de cada fase) é um arquivo à parte no Zenodo e vai junto.
    # Os CSV com rótulo por alerta são a fonte abaixo.
    pasta: ait-ads/json
    arquivos:
      - url: https://zenodo.org/api/records/8263181/files/ait_ads.zip/content
        nome: ait_ads.zip
        sha256: 9f0595c4ebe56ac9223763881f55369dd4f249a8108064e4ae108eb3309aeeb9
        descompactar: true
        conteudo:
          fox_aminer.json: 3de2f6d87c843b99dbc5ca3d5225fcd42f60938187d6391dc33d01c216fffcb4
          fox_wazuh.json: e03787f1a4402b034c4c2648c0632d92c5982aecaa6146837695ca7aa3023b51
